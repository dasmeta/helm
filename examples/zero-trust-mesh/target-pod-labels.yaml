# helm template ztm-target-pod-labels ./charts/zero-trust-mesh -n default -f ./examples/zero-trust-mesh/target-pod-labels.yaml
service: frontend
namespaceResourcesEnabled: false
denyAll:
  enabled: true
  podLabels:
    app: frontend
    component: web
allowPolicies:
  - type: egress
    service: backend
    podLabels:
      app: backend
      component: api
    port: 8080
