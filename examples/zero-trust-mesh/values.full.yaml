namespace: default

labels:
  namespaceLabelKey: kubernetes.io/metadata.name

namespaceResources:
  enabled: true

# Current service identity.
service: backend
serviceAccount: backend-runtime-sa

# Optional service-level deny-all. Use this for a protected service release.
# Keep this disabled for source/peer services that should stay unrestricted.
denyAll:
  enabled: true
  podLabels:
    app.kubernetes.io/name: backend

allowPolicies:
  # Inbound traffic to backend from selected in-mesh services.
  - type: ingress
    service: frontend
    namespace: default
    serviceAccount: frontend-runtime-sa
    podLabels:
      app.kubernetes.io/name: frontend
    port: 8080
    protocol: TCP
    methods: ["GET", "POST"]
    paths: ["/api/*"]

  # Inbound traffic from a non-mesh source such as an ingress controller.
  # NetworkPolicy still restricts packets to the selected pods.
  - type: ingress
    service: ingress-nginx
    namespace: ingress-nginx
    podLabels:
      app.kubernetes.io/name: ingress-nginx
      app.kubernetes.io/component: controller
    port: 8080
    protocol: TCP
    allowUnauthenticated: true

  # Outbound traffic from backend to another service.
  - type: egress
    service: auth
    namespace: shared
    port: 8080
    protocol: TCP
    podLabels:
      app.kubernetes.io/name: auth

  - type: egress
    service: payments
    namespace: poc-mesh
    port: 8080
    protocol: TCP
    podLabels:
      app.kubernetes.io/name: payments

  # External host egress.
  - type: egress
    hosts:
      - api.stripe.com
      - s3.eu-central-1.amazonaws.com
    # Optional host ports; merged with defaults 80/HTTP and 443/HTTPS.
    ports:
      - number: 443
        protocol: TLS
      - number: 8443
        protocol: HTTPS

networkPolicy:
  enabled: true
  defaultDeny: true
  allowDns: true
  dnsNamespace: kube-system
  dnsPodLabels:
    k8s-app: kube-dns
  egressGateway:
    enabled: false
    namespace: istio-system
    podLabels:
      istio: egressgateway
    ports:
      - port: 443
        protocol: TCP
      - port: 80
        protocol: TCP

istio:
  enabled: true
  strictMtls: true
  defaultDenyAuthorization: true
  egressGateway:
    enabled: false
    namespace: istio-system
    # serviceName should match your real Istio gateway Service (for example: main-istio)
    serviceName: istio-egressgateway
    selector:
      istio: egressgateway
