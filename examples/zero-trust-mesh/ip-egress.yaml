# helm template ztm-ip-egress ./charts/zero-trust-mesh -n default -f ./examples/zero-trust-mesh/ip-egress.yaml
service: frontend
namespaceResourcesEnabled: false
allowPolicies:
  - type: egress
    ips:
      - 192.0.2.10
      - 198.51.100.0/24
    ports:
      - number: 443
        protocol: TCP
      - number: 8080
        protocol: HTTP
