# Runtime configuration is supplied by the platform secret-management flow.
redashRuntimeSecret: &redashRuntimeSecret example-redash-runtime

server:
  envFrom:
    secret: *redashRuntimeSecret
  initContainers:
    - name: create-database
      image:
        repository: redash/redash
        tag: 26.3.0
        pullPolicy: IfNotPresent
      args:
        - create_db
      envFrom:
        - secretRef:
            name: *redashRuntimeSecret
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

scheduler:
  envFrom:
    secret: *redashRuntimeSecret

scheduledWorker:
  envFrom:
    secret: *redashRuntimeSecret

adhocWorker:
  envFrom:
    secret: *redashRuntimeSecret

defaultWorker:
  envFrom:
    secret: *redashRuntimeSecret
