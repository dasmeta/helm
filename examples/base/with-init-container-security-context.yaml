# helm template example ./charts/base/ -f ./examples/base/with-init-container-security-context.yaml

initContainers:
  - name: migrator-service
    image:
      repository: example/migrator
      tag: example
      pullPolicy: IfNotPresent
    securityContext:
      runAsNonRoot: true
      runAsUser: 1002
      runAsGroup: 1001
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
