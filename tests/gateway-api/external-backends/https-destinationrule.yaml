#@ desc: HTTPS external backend gets TLS origination with SNI, exported to the Gateway namespace only
#@ kind: DestinationRule
#@ assert: .metadata.name == "ext-lookup"
#@ assert: .spec.trafficPolicy.portLevelSettings[0].tls.mode == "SIMPLE"
#@ assert: .spec.trafficPolicy.portLevelSettings[0].tls.sni == "cdn.example.net"
#@ assert: (.spec.exportTo | length) == 1 and .spec.exportTo[0] == "istio-system"
httpRoutes:
  - name: lookup
    parentRefs: [{ name: main }]
    hostnames: [lookup.example.com]
    rules:
      - matches: [{ path: { type: PathPrefix, value: /lookup } }]
        backendRefs: { name: lookup-cdn, port: 443, external: { host: cdn.example.net, protocol: HTTPS, rewriteHost: true, create: true } }
