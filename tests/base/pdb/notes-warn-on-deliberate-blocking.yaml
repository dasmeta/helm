#@ desc: a deliberately blocking budget must warn in the install notes, where an operator will see it
#@ assert: .spec.minAvailable == 3
#@ assert-notes: ZERO voluntary evictions
#@ assert-notes: pdb.allowZeroEvictions=true
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 3
pdb:
  enabled: true
  minAvailable: 3
  allowZeroEvictions: true
