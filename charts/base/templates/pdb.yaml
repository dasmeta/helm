{{- /* Validation runs first and unconditionally: an invalid budget must be refused
       even in the cases where no budget would be rendered. See specs/020-base-chart-pdb-safety. */ -}}
{{- include "base.pdb.validate" . -}}
{{- $pdb := .Values.pdb | default dict -}}
{{- $floorVal := int (include "base.pdb.floor" .) -}}
{{- $hasMin := and (hasKey $pdb "minAvailable") (not (kindIs "invalid" $pdb.minAvailable)) -}}
{{- $hasMax := and (hasKey $pdb "maxUnavailable") (not (kindIs "invalid" $pdb.maxUnavailable)) -}}
{{- /* Explicit enablement wins over every automatic-creation guard: the author has taken ownership. */ -}}
{{- $explicit := and (hasKey $pdb "enabled") (eq (include "base.toBool" $pdb.enabled) "true") -}}
{{- $auto := and (not (hasKey $pdb "enabled")) (include "base.pdb.mayAutoCreate" .) -}}
{{- $enabled := or $explicit $auto -}}
{{- if and $enabled (ge $floorVal 2) -}}
{{- /* policy/v1 is served from 1.21. The chart supports 1.18+, and this is the first template to create a
       PDB without being asked, so pre-1.21 consumers would newly fail on apply. Same gate as ingress.yaml. */ -}}
{{- if semverCompare ">=1.21-0" (include "base.capabilities.kubeVersion" .) -}}
apiVersion: policy/v1
{{- else -}}
apiVersion: policy/v1beta1
{{- end }}
kind: PodDisruptionBudget
metadata:
  name: {{ $pdb.pdbName | default (include "base.fullname" .) }}
  {{- if include "base.pdb.isDeliberatelyBlocking" . }}
  annotations:
    # Recorded on the object so `kubectl describe pdb` explains a disruptionsAllowed of 0, rather than
    # leaving whoever finds a stuck drain to guess whether it is deliberate.
    dasmeta.io/zero-evictions: "deliberate, pdb.allowZeroEvictions=true; this workload is rolled by hand"
  {{- end }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else if $hasMax }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- else }}
  maxUnavailable: {{ include "base.pdb.defaultMaxUnavailable" . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "base.selectorLabels" . | nindent 6 }}
{{- end }}
