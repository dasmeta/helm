{{- if and .Values.mcpProducts.enabled .Values.mcpProductsSessionAffinity.enabled }}
{{- $name := include "galust-ai-layer.mcpProductsSessionAffinityName" . }}
{{- $serviceName := default "ai-layer-mcp-products" .Values.mcpProducts.fullnameOverride }}
{{- $timeout := default 10800 .Values.mcpProductsSessionAffinity.timeoutSeconds }}
{{- $hookAnnotations := dict "helm.sh/hook" "post-install,post-upgrade" "helm.sh/hook-weight" "5" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "galust-ai-layer.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "galust-ai-layer.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - services
    resourceNames:
      - {{ $serviceName }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "galust-ai-layer.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "galust-ai-layer.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $hookAnnotations | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "galust-ai-layer.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: OnFailure
      containers:
        - name: patch-session-affinity
          image: "{{ .Values.mcpProductsSessionAffinity.image.repository }}:{{ .Values.mcpProductsSessionAffinity.image.tag }}"
          imagePullPolicy: {{ .Values.mcpProductsSessionAffinity.image.pullPolicy }}
          command:
            - kubectl
          args:
            - -n
            - {{ .Release.Namespace }}
            - patch
            - svc
            - {{ $serviceName }}
            - --type
            - merge
            - -p
            - '{"spec":{"sessionAffinity":"ClientIP","sessionAffinityConfig":{"clientIP":{"timeoutSeconds":{{ $timeout }}}}}}'
{{- end }}
