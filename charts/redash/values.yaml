server:
  # Inherited base-chart naming: keep fullnameOverride empty so the release name
  # remains in resource names; the unique nameOverride scopes this component.
  nameOverride: redash-server
  appVersion: 26.3.0
  image:
    repository: redash/redash
    tag: 26.3.0
    pullPolicy: Always
  replicaCount: 1
  containerPort: 5000
  service:
    type: ClusterIP
    port: 5000
  serviceAccount:
    create: false
  ingress:
    enabled: false
  args:
    - server

scheduler:
  nameOverride: redash-scheduler
  appVersion: 26.3.0
  image:
    repository: redash/redash
    tag: 26.3.0
    pullPolicy: Always
  service:
    enabled: false
  serviceAccount:
    create: false
  args:
    - scheduler

scheduledWorker:
  nameOverride: redash-scheduled-worker
  appVersion: 26.3.0
  image:
    repository: redash/redash
    tag: 26.3.0
    pullPolicy: Always
  service:
    enabled: false
  serviceAccount:
    create: false
  args:
    - worker
  extraEnv:
    QUEUES: scheduled_queries,schemas
    WORKERS_COUNT: "1"

adhocWorker:
  nameOverride: redash-adhoc-worker
  appVersion: 26.3.0
  image:
    repository: redash/redash
    tag: 26.3.0
    pullPolicy: Always
  service:
    enabled: false
  serviceAccount:
    create: false
  args:
    - worker
  extraEnv:
    QUEUES: queries
    WORKERS_COUNT: "2"

defaultWorker:
  nameOverride: redash-default-worker
  appVersion: 26.3.0
  image:
    repository: redash/redash
    tag: 26.3.0
    pullPolicy: Always
  service:
    enabled: false
  serviceAccount:
    create: false
  args:
    - worker
  extraEnv:
    QUEUES: periodic,emails,default
    WORKERS_COUNT: "1"
