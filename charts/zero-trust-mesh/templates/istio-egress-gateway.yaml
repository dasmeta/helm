{{- $istio := .Values.istio | default (dict) -}}
{{- $egw := $istio.egressGateway | default (dict) -}}
{{- $egwNamespace := default "istio-system" $egw.namespace -}}
{{- $egwServiceName := default "istio-egressgateway" $egw.serviceName -}}
{{- $egress := list -}}
{{- range (.Values.allowPolicies | default (list)) -}}
{{- if eq (default "" .type) "egress" -}}
{{- $egress = append $egress . -}}
{{- end -}}
{{- end -}}
{{- if and (ne $istio.enabled false) (eq $egw.enabled true) $egress }}
{{- $workloadNamespace := include "ztm.workloadNamespace" . -}}
{{- range $egress }}
{{- if .hosts }}
{{- range .hosts }}
{{- $sourceWorkload := include "ztm.workloadName" $ -}}
{{- $gatewayIdentity := dict "kind" "Gateway" "direction" "egress" "workloadNamespace" $workloadNamespace "host" . "egressGatewayNamespace" $egwNamespace | toJson -}}
{{- $gatewayName := include "ztm.resourceName" (dict "root" $ "namespace" $egwNamespace "target" $sourceWorkload "purpose" "egress-gw" "identity" $gatewayIdentity) -}}
{{- $virtualServiceIdentity := dict "kind" "VirtualService" "direction" "egress" "host" . "gatewayName" $gatewayName "egressGatewayNamespace" $egwNamespace "egressGatewayServiceName" $egwServiceName | toJson -}}
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ $gatewayName }}
  namespace: {{ $egwNamespace }}
spec:
  selector:
    {{- toYaml (default (dict "istio" "egressgateway") $egw.selector) | nindent 4 }}
  servers:
    - port:
        number: 443
        name: tls
        protocol: TLS
      hosts:
        - {{ . | quote }}
      tls:
        mode: PASSTHROUGH
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "ztm.resourceName" (dict "root" $ "namespace" $workloadNamespace "target" $sourceWorkload "purpose" "egress-route" "identity" $virtualServiceIdentity) }}
  namespace: {{ $workloadNamespace }}
spec:
  hosts:
    - {{ . | quote }}
  gateways:
    - mesh
    - {{ printf "%s/%s" $egwNamespace $gatewayName }}
  tls:
    - match:
        - gateways:
            - mesh
          port: 443
          sniHosts:
            - {{ . | quote }}
      route:
        - destination:
            host: {{ printf "%s.%s.svc.cluster.local" $egwServiceName $egwNamespace }}
            port:
              number: 443
    - match:
        - gateways:
            - {{ printf "%s/%s" $egwNamespace $gatewayName }}
          port: 443
          sniHosts:
            - {{ . | quote }}
      route:
        - destination:
            host: {{ . | quote }}
            port:
              number: 443
{{- end }}
{{- end }}
{{- end }}
{{- end }}
