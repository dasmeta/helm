{{- $np := .Values.networkPolicy | default (dict) -}}
{{- $egress := list -}}
{{- range (.Values.allowPolicies | default (list)) -}}
{{- if eq (default "" .type) "egress" -}}
{{- $egress = append $egress . -}}
{{- end -}}
{{- end -}}
{{- if and (ne $np.enabled false) $egress }}
{{- $workloadNamespace := include "ztm.workloadNamespace" . -}}
{{- $sourceWorkload := include "ztm.workloadName" . -}}
{{- range $egress }}
{{- if .ips }}
{{- $defaultPorts := list (dict "number" 443 "protocol" "TCP") -}}
{{- $ports := .ports | default $defaultPorts -}}
{{- $addresses := list -}}
{{- range .ips }}
{{- $addresses = append $addresses (include "ztm.ipCidr" .) -}}
{{- end -}}
{{- $identity := dict "kind" "NetworkPolicy" "direction" "egress" "addresses" $addresses "ports" $ports | toJson -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztm.resourceName" (dict "root" $ "namespace" $workloadNamespace "target" $sourceWorkload "purpose" "egress-ip" "identity" $identity) }}
  namespace: {{ $workloadNamespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztm.denyAllPodLabels" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range $addresses }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range $port := $ports }}
        {{- $number := required "egress[].ips ports[].number is required" $port.number }}
        - port: {{ $number }}
          protocol: {{ include "ztm.networkPolicyProtocol" $port.protocol }}
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
