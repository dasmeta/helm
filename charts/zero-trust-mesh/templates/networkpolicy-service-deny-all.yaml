{{- $denyAll := default (.Values.serviceDenyAll | default (dict)) .Values.denyAll -}}
{{- $np := .Values.networkPolicy | default (dict) -}}
{{- if and (default false $denyAll.enabled) (default true $np.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztm.fullname" . }}-service-deny-all
  namespace: {{ include "ztm.workloadNamespace" . }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztm.serviceDenyAllPodLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
