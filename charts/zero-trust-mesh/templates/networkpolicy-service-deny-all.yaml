{{- $denyAll := .Values.denyAll | default (dict) -}}
{{- $np := .Values.networkPolicy | default (dict) -}}
{{- if and (default false $denyAll.enabled) (default true $np.enabled) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztm.resourceName" (dict "root" . "purpose" "service-deny" "identity" "service-deny-all-network-policy") }}
  namespace: {{ include "ztm.workloadNamespace" . }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztm.denyAllPodLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
