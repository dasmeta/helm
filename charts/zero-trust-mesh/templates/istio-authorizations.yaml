{{- $istio := .Values.istio | default (dict) -}}
{{- $legacy := .Values.legacyAllowToIngress | default (dict) -}}
{{- $egress := concat (.Values.egress | default (list)) (.Values.allowTo | default (list)) -}}
{{- range (.Values.allowPolicies | default (list)) -}}
{{- if eq (default "" .type) "egress" -}}
{{- $egress = append $egress . -}}
{{- end -}}
{{- end -}}
{{- range (.Values.allowpolices | default (list)) -}}
{{- if eq (default "" .type) "egress" -}}
{{- $egress = append $egress . -}}
{{- end -}}
{{- end -}}
{{- if and (default false $legacy.enabled) (default true $istio.enabled) $egress }}
{{- $sourceNamespace := include "ztm.workloadNamespace" . -}}
{{- $sourceServiceAccount := include "ztm.workloadServiceAccount" . -}}
{{- range $egress }}
{{- $targetService := default .workload .service -}}
{{- if $targetService }}
{{- $targetNamespace := default $sourceNamespace .namespace -}}
{{- $targetServiceAccount := default $targetService .serviceAccount -}}
{{- $policyName := printf "allow-%s-to-%s" $sourceServiceAccount $targetServiceAccount -}}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ include "ztm.sanitizeName" $policyName }}
  namespace: {{ $targetNamespace }}
spec:
  selector:
    matchLabels:
      {{- include "ztm.targetPodLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - {{ printf "cluster.local/ns/%s/sa/%s" $sourceNamespace $sourceServiceAccount | quote }}
      to:
        - operation:
            {{- if .methods }}
            methods:
              {{- toYaml .methods | nindent 14 }}
            {{- end }}
            {{- if .paths }}
            paths:
              {{- toYaml .paths | nindent 14 }}
            {{- end }}
{{ end }}
{{ end }}
{{- end }}
