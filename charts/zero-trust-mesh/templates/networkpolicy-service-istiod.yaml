{{- $denyAll := .Values.denyAll | default (dict) -}}
{{- $np := .Values.networkPolicy | default (dict) -}}
{{- $istio := .Values.istio | default (dict) -}}
{{- $nsr := .Values.namespaceResources | default (dict) -}}
{{- if and (default false $denyAll.enabled) (default true $np.enabled) (default true $istio.enabled) (not (default false (default .Values.namespaceResourcesEnabled $nsr.enabled))) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztm.resourceName" (dict "root" . "purpose" "allow-istiod" "identity" (dict "kind" "NetworkPolicy" "scope" "service" "destination" "istiod" | toJson)) }}
  namespace: {{ include "ztm.workloadNamespace" . }}
  labels:
    {{- include "ztm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztm.denyAllPodLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
          podSelector:
            matchLabels:
              app: istiod
              istio: pilot
      ports:
        - port: 15010
          protocol: TCP
        - port: 15012
          protocol: TCP
        - port: 15014
          protocol: TCP
        - port: 15017
          protocol: TCP
        - port: 443
          protocol: TCP
{{- end }}
