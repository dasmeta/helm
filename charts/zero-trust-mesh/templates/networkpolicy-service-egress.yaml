{{- $np := .Values.networkPolicy | default (dict) -}}
{{- $denyAll := default (.Values.serviceDenyAll | default (dict)) .Values.denyAll -}}
{{- $labels := .Values.labels | default (dict) -}}
{{- $egress := list -}}
{{- range (.Values.allowPolicies | default (list)) -}}
{{- if eq (default "" .type) "egress" -}}
{{- $egress = append $egress . -}}
{{- end -}}
{{- end -}}
{{- if and (default false $denyAll.enabled) (default true $np.enabled) $egress }}
{{- $sourceNamespace := include "ztm.workloadNamespace" . -}}
{{- $sourceWorkload := include "ztm.workloadName" . -}}
{{- range $egress }}
{{- $targetService := default .workload .service -}}
{{- if $targetService }}
{{- $targetNamespace := default $sourceNamespace .namespace -}}
{{- $ruleName := printf "%s-egress-to-%s-%v" $sourceWorkload $targetService (.port | default 8080) -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-{{ include "ztm.sanitizeName" $ruleName }}
  namespace: {{ $sourceNamespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztm.serviceDenyAllPodLabels" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{ default "kubernetes.io/metadata.name" $labels.namespaceLabelKey }}: {{ $targetNamespace }}
          podSelector:
            matchLabels:
              {{- include "ztm.targetPodLabels" . | nindent 14 }}
      ports:
        - port: {{ .port | default 8080 }}
          protocol: {{ .protocol | default "TCP" }}
{{ end }}
{{ end }}
{{- end }}
