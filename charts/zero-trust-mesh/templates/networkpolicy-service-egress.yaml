{{- $np := .Values.networkPolicy | default (dict) -}}
{{- $denyAll := .Values.denyAll | default (dict) -}}
{{- $labels := .Values.labels | default (dict) -}}
{{- $egress := list -}}
{{- range (.Values.allowPolicies | default (list)) -}}
{{- if eq (default "" .type) "egress" -}}
{{- $egress = append $egress . -}}
{{- end -}}
{{- end -}}
{{- if and (default false $denyAll.enabled) (default true $np.enabled) $egress }}
{{- $sourceNamespace := include "ztm.workloadNamespace" . -}}
{{- $sourceWorkload := include "ztm.workloadName" . -}}
{{- range $egress }}
{{- $targetService := default .workload .service -}}
{{- if $targetService }}
{{- $targetNamespace := default $sourceNamespace .namespace -}}
{{- $identity := dict "kind" "NetworkPolicy" "direction" "egress" "targetNamespace" $targetNamespace "targetService" $targetService "podLabels" .podLabels "port" (.port | default 8080) "protocol" (.protocol | default "TCP") | toJson -}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ztm.resourceName" (dict "root" $ "namespace" $sourceNamespace "target" $sourceWorkload "purpose" "egress-svc" "identity" $identity) }}
  namespace: {{ $sourceNamespace }}
spec:
  podSelector:
    matchLabels:
      {{- include "ztm.denyAllPodLabels" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{ default "kubernetes.io/metadata.name" $labels.namespaceLabelKey }}: {{ $targetNamespace }}
          podSelector:
            matchLabels:
              {{- include "ztm.targetPodLabels" . | nindent 14 }}
      ports:
        - port: {{ .port | default 8080 }}
          protocol: {{ .protocol | default "TCP" }}
{{ end }}
{{ end }}
{{- end }}
