{{- /* UDPRoute gateway.networking.k8s.io/v1, part of the Gateway API v1.6 standard channel CRDs. */ -}}
{{- if .Values.udpRoutes }}
{{- $outer := . -}}
{{- $routes := .Values.udpRoutes -}}
{{- if $routes }}
{{- range $idx, $route := (ternary $routes (list $routes) (kindIs "slice" $routes)) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: {{ default (include "gateway-api.fullname" $outer) $route.name }}{{ coalesce $route.nameSuffix $idx "" }}
  labels:
    {{- include "gateway-api.labels" $outer | nindent 4 }}
    {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- $parentRefs := (or $route.parentRefs ($outer.Values.defaultParentRefs | default (list))) -}}
  {{- if $parentRefs }}
  parentRefs:
    {{- range $parentRefs }}
    - name: {{ .name | quote }}
      kind: {{ default "Gateway" .kind | quote }}
      group: {{ default "gateway.networking.k8s.io" .group | quote }}
      namespace: {{ default "istio-system" .namespace | quote }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with $route.rules }}
  rules:
    {{- range . }}
      {{- $rule := dict }}
      {{- /* the v1 rule has only name and backendRefs (no matches) */ -}}
      {{- with .name }}
        {{- $_ := set $rule "name" . }}
      {{- end }}
      {{- $backendRefs := .backendRefs | default (list (dict)) }}
      {{- if $backendRefs }}
        {{- $processedBackendRefs := list }}
        {{- range $backendRefs }}
          {{- $backendRef := dict "name" (default $outer.Release.Name .name) "port" (default 80 .port) }}
          {{- if .namespace }}
            {{- $_ := set $backendRef "namespace" .namespace }}
          {{- end }}
          {{- if .weight }}
            {{- $_ := set $backendRef "weight" .weight }}
          {{- end }}
          {{- with .group }}
            {{- $_ := set $backendRef "group" . }}
          {{- end }}
          {{- with .kind }}
            {{- $_ := set $backendRef "kind" . }}
          {{- end }}
          {{- $processedBackendRefs = append $processedBackendRefs $backendRef }}
        {{- end }}
        {{- $_ := set $rule "backendRefs" $processedBackendRefs }}
      {{- end }}
      {{- if $rule.backendRefs }}
        {{- toYaml (list $rule) | nindent 4 | trimPrefix "- " }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
