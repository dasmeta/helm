{{- /* BackendTLSPolicy (Gateway API v1.6 standard channel): TLS from the Gateway to a backend Service
       (spec.targetRefs, spec.validation, spec.options). Spec fields are passed as-is. */ -}}
{{- $outer := . -}}
{{- $items := .Values.backendTLSPolicies | default (list) -}}
{{- range $idx, $item := (ternary $items (list $items) (kindIs "slice" $items)) }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ default (printf "%s-backendtlspolicy-%d" (include "gateway-api.fullname" $outer) $idx) $item.name | quote }}
  namespace: {{ default $outer.Release.Namespace $item.namespace | quote }}
  labels:
    {{- include "gateway-api.labels" $outer | nindent 4 }}
    {{- with $item.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $item.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* spec: the item's `spec`, or its fields other than name/namespace/labels/annotations, passed as-is */ -}}
{{- $spec := ternary $item.spec (omit $item "name" "namespace" "labels" "annotations") (hasKey $item "spec") }}
{{- with $spec }}
spec:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
