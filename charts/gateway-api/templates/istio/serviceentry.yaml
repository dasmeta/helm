{{- $outer := . -}}
{{- $entries := .Values.istio.serviceEntries | default (list) -}}
{{- $entries = ternary $entries (list $entries) (kindIs "slice" $entries) -}}
{{- /* Registrations for httpRoutes rules[].backendRefs[].external, appended after the manual entries so unnamed
       manual entries keep their index based default names. The port is declared HTTP also for HTTPS backends:
       the generated DestinationRule originates TLS on it. exportTo "*" lets the Gateway namespace see it. */ -}}
{{- range (include "gateway-api.externalBackends" . | fromJsonArray) }}
  {{- $entries = append $entries (dict
    "name" .resourceName
    "hosts" (list .host)
    "location" "MESH_EXTERNAL"
    "resolution" "DNS"
    "endpoints" (list (dict "address" .endpoint))
    "ports" (list (dict "number" (int .port) "name" (printf "http-%d" (int .port)) "protocol" "HTTP"))
    "exportTo" (list "*")
  ) }}
{{- end }}
{{- if $entries }}
{{- range $idx, $entry := $entries }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ default (printf "%s-se-%d" (include "gateway-api.fullname" $outer) $idx) $entry.name }}
  namespace: {{ default $outer.Release.Namespace $entry.namespace | quote }}
  labels:
    {{- include "gateway-api.labels" $outer | nindent 4 }}
    {{- with $entry.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $entry.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $entry.hosts }}
  hosts: {{- toYaml $entry.hosts | nindent 2 }}
  {{- end }}
  {{- if $entry.addresses }}
  addresses: {{- toYaml $entry.addresses | nindent 2 }}
  {{- end }}
  {{- if $entry.ports }}
  ports: {{- toYaml $entry.ports | nindent 2 }}
  {{- end }}
  {{- if $entry.location }}
  location: {{ $entry.location | quote }}
  {{- end }}
  {{- if $entry.resolution }}
  resolution: {{ $entry.resolution | quote }}
  {{- end }}
  {{- if $entry.endpoints }}
  endpoints: {{- toYaml $entry.endpoints | nindent 2 }}
  {{- end }}
  {{- if $entry.exportTo }}
  exportTo: {{- toYaml $entry.exportTo | nindent 2 }}
  {{- end }}
  {{- if $entry.subjectAltNames }}
  subjectAltNames: {{- toYaml $entry.subjectAltNames | nindent 2 }}
  {{- end }}
  {{- if $entry.workloadSelector }}
  workloadSelector:
    {{- toYaml $entry.workloadSelector | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
