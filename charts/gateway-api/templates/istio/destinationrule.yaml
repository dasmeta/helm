{{- $outer := . -}}
{{- $rules := .Values.istio.destinationRules | default (list) -}}
{{- $rules = ternary $rules (list $rules) (kindIs "slice" $rules) -}}
{{- /* TLS origination for httpRoutes external backends with protocol HTTPS (SNI = host, the upstream certificate is
       verified against the proxy's system CAs), appended after the manual rules to keep their default names */ -}}
{{- range (include "gateway-api.externalBackends" . | fromJsonArray) }}
  {{- if eq .protocol "HTTPS" }}
    {{- $rules = append $rules (dict
      "name" .resourceName
      "host" .host
      "trafficPolicy" (dict "portLevelSettings" (list (dict "port" (dict "number" (int .port)) "tls" (dict "mode" "SIMPLE" "sni" .host))))
      "exportTo" .exportTo
    ) }}
  {{- end }}
{{- end }}
{{- if $rules }}
{{- range $idx, $rule := $rules }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ default (printf "%s-dest-rule-%d" (include "gateway-api.fullname" $outer) $idx) $rule.name }}
  namespace: {{ default $outer.Release.Namespace $rule.namespace | quote }}
  labels:
    {{- include "gateway-api.labels" $outer | nindent 4 }}
    {{- with $rule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $rule.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if $rule.host }}
  host: {{ $rule.host | quote }}
  {{- end }}
  {{- with $rule.exportTo }}
  exportTo: {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with $rule.trafficPolicy }}
  trafficPolicy:
    {{- with .loadBalancer }}
    loadBalancer:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .connectionPool }}
    connectionPool:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .outlierDetection }}
    outlierDetection:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .tls }}
    tls:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .portLevelSettings }}
    portLevelSettings:
      {{- range . }}
      - {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- with $rule.subsets }}
  subsets:
    {{- range . }}
    - name: {{ .name | quote }}
      {{- with .labels }}
      labels:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .trafficPolicy }}
      trafficPolicy:
        {{- with .loadBalancer }}
        loadBalancer:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .connectionPool }}
        connectionPool:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .outlierDetection }}
        outlierDetection:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .tls }}
        tls:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
