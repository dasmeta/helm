  #         patch:
  #           operation: MERGE
  #           value:
  #             response_headers_to_add:
  #               - header: { key: x-served-by, value: gateway }
  envoyFilters: []

  # List (or single object) of Istio TrafficExtension resources (extensions.istio.io/v1alpha1, Istio 1.30+): Lua
  # (lua.inlineCode) or Wasm (wasm.*) proxy extensions through a supported API. Defaults to istio-system.
  #
  # Example:
  # trafficExtensions:
  #   - name: add-header
